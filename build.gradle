plugins {
    id 'org.springframework.boot' version '3.5.16' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}
subprojects {
    apply plugin: 'java'
    apply plugin: 'jacoco'
    group = 'io.github.ifenixi.supportflow'
    version = '1.0.0'
    repositories { mavenCentral() }
    java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.compilerArgs += '-parameters' }
    tasks.withType(Test).configureEach { useJUnitPlatform(); testLogging { events 'failed', 'skipped' } }
    tasks.named('test') { exclude '**/*IT.class'; finalizedBy jacocoTestReport }
    tasks.register('integrationTest', Test) {
        description = 'Runs Testcontainers integration tests; requires Docker'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        include '**/*IT.class'
        shouldRunAfter test
    }
}
configure([project(':api'), project(':worker')]) {
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-validation'
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        implementation 'org.springframework.boot:spring-boot-starter-amqp'
        implementation 'org.flywaydb:flyway-core'
        implementation 'org.flywaydb:flyway-database-postgresql'
        runtimeOnly 'org.postgresql:postgresql'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'org.testcontainers:junit-jupiter'
        testImplementation 'org.testcontainers:postgresql'
        testImplementation 'org.testcontainers:rabbitmq'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}
project(':api') {
    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        implementation 'org.springframework.boot:spring-boot-starter-security'
        implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
        implementation 'org.springframework.boot:spring-boot-starter-data-redis'
        implementation 'org.springframework.retry:spring-retry'
        implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'
        testImplementation 'org.springframework.security:spring-security-test'
    }
}
project(':worker') { dependencies { implementation 'org.springframework.boot:spring-boot-starter-jdbc' } }
project(':learning-lab') {
    dependencies { testImplementation platform('org.junit:junit-bom:5.12.2'); testImplementation 'org.junit.jupiter:junit-jupiter'; testRuntimeOnly 'org.junit.platform:junit-platform-launcher' }
}
