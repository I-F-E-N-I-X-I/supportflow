server:
  port: 8081
spring:
  application:
    name: supportflow-notification-worker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notifications}
    username: ${DB_USER:supportflow}
    password: ${DB_PASSWORD}
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:supportflow}
    password: ${RABBIT_PASSWORD}
    listener:
      simple:
        prefetch: 10
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 500ms
          max-attempts: 3
          multiplier: 2
          max-interval: 2s
app:
  internal-token: ${INTERNAL_TOKEN}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
