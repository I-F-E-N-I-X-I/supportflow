services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: supportflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run scripts/init-env.ps1 or init-env.sh}
      POSTGRES_DB: supportflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/init-databases.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportflow -d supportflow"]
      interval: 5s
      timeout: 3s
      retries: 30
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: supportflow
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:?Generate .env}
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Generate .env}
    command: ["sh", "-c", 'exec redis-server --requirepass "$$REDIS_PASSWORD"']
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 30
  worker:
    build:
      context: .
      target: worker
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/notifications
      DB_PASSWORD: ${DB_PASSWORD}
      RABBIT_HOST: rabbitmq
      RABBIT_PASSWORD: ${RABBIT_PASSWORD}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Generate .env}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
  api:
    build:
      context: .
      target: api
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/supportflow
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBIT_HOST: rabbitmq
      RABBIT_PASSWORD: ${RABBIT_PASSWORD}
      WORKER_URL: http://worker:8081
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      JWT_SECRET: ${JWT_SECRET:?Generate .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Generate .env}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    restart: unless-stopped
volumes:
  postgres-data:
  rabbit-data:
